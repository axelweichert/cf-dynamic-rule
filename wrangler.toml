# Cloudflare Worker Konfiguration
# Doku: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "cf-dynamic-rule"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "dynamic-access.vonbusch.app", custom_domain = true }
]

# Cron Trigger fuer Cleanup abgelaufener Gateway-Rules (alle 5 Min)
[triggers]
crons = ["*/5 * * * *"]

# Nicht-geheime ENV-Variablen
[vars]
RULE_TTL_MINUTES = "20"
RULE_TAG_PREFIX = "cf-dynamic-rule"
ACCESS_TEAM_DOMAIN = "vonbuschthree60.cloudflareaccess.com"
RULE_PRECEDENCE = "1500"
# CSV der Admin-Emails. Nur diese Email-Adressen sehen den Admin-Tab und
# duerfen Targets verwalten. Pflege via Code-Push (Aenderung hier + Auto-Deploy).
ADMIN_EMAILS = "axel.weichert@vonbusch.digital,marius.petrich@vonbusch.digital,mario.hysa@vonbusch.digital"

# Observability
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1.0

# KV Namespace fuer Target-Whitelist
# Angelegt im Account "von Busch GmbH - Kunden Demoumgebung NFR".
[[kv_namespaces]]
binding = "TARGETS"
id = "a9828e41f148408b91a97fd42d7d58a6"

# R2 Bucket fuer Audit-Log
# Vor Deploy:
#   wrangler r2 bucket create cf-dynamic-rule-audit
[[r2_buckets]]
binding = "AUDIT"
bucket_name = "cf-dynamic-rule-audit"

# D1 Datenbank fuer User, Access Packages, Audit-Spiegel (v0.5.0+).
# Angelegt 2026-05-08 via Cloudflare MCP, primary_location_hint = weur.
[[d1_databases]]
binding = "DB"
database_name = "cf-dynamic-rule-db"
database_id = "c821ce0b-69bf-47e6-816e-84ee2d547789"
migrations_dir = "migrations"

# Secrets via Cloudflare Dashboard
# (Worker -> Settings -> Variables and Secrets -> Add -> Type: Secret)
# oder via `wrangler secret put <NAME>`:
#   - CF_API_TOKEN
#   - CF_ACCOUNT_ID
#   - ACCESS_AUD
